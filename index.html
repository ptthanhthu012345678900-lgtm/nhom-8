<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhóm 8 — Bộ thủ thực phẩm</title>
<style>
:root{
  --paper:#faf6ef; --ink:#2b2620; --muted:#8a7d6c;
  --line:#e8dcc8; --accent:#c0601a; --accent-soft:#f8e0c8;
  --cjk:"Noto Serif CJK SC","Songti SC","PingFang SC","Microsoft YaHei",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     background:var(--paper);color:var(--ink);line-height:1.5}
main{max-width:600px;margin:0 auto;padding:24px 18px 56px}
h1{font-size:.9rem;font-weight:600;margin:0 0 4px;text-align:center;
   color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
h1 + p{text-align:center;font-size:.8rem;color:var(--muted);margin:0 0 16px}

.stage{background:#fff;border-radius:26px;padding:10px;
       border:1.5px solid var(--line);overflow:hidden;
       box-shadow:0 8px 32px rgba(192,96,26,.08)}
svg#fig{width:100%;height:auto;display:block}

.hotspot{cursor:pointer;outline:none;
  transform-box:fill-box;transform-origin:center;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.hotspot:hover{transform:scale(1.14)}
.hotspot circle{
  fill:url(#spot);stroke:var(--accent);stroke-width:1.8;
  filter:drop-shadow(0 2px 4px rgba(192,96,26,.3));
  transition:fill .2s,stroke-width .2s;
}
.hotspot .glyph{
  font-family:var(--cjk);font-size:22px;fill:var(--ink);
  text-anchor:middle;dominant-baseline:central;
  pointer-events:none;transition:fill .2s;
}
.hotspot.sel{transform:scale(1.14)}
.hotspot.sel circle{fill:var(--accent);stroke:#8a3a0a;stroke-width:2.5}
.hotspot.sel .glyph{fill:#fff}
.hotspot:focus-visible circle{stroke-width:4}

.card{background:#fff;border-radius:26px;border:1.5px solid var(--line);
      padding:28px 20px 26px;margin-top:14px;text-align:center;min-height:260px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      box-shadow:0 8px 32px rgba(192,96,26,.08)}
.card .icon{font-size:76px;line-height:1;margin-bottom:12px;
             filter:drop-shadow(0 4px 10px rgba(0,0,0,.12))}
.card .glyph{font-family:var(--cjk);font-size:62px;line-height:1;
             color:var(--accent);margin-bottom:4px}
.card .variant{font-family:var(--cjk);font-size:.95rem;color:var(--muted);
               margin-bottom:6px}
.card .pron{font-size:1.3rem;margin:0 0 2px;letter-spacing:.02em}
.card .pron .hv{color:var(--muted);margin-left:8px;font-size:1rem;letter-spacing:0}
.card .meaning{font-size:1.3rem;font-weight:600;margin:0 0 20px;
               color:var(--accent)}
.card .examples{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.card .ex{display:flex;flex-direction:column;align-items:center;gap:1px;
          padding:8px 12px;border-radius:12px;background:#fdfaf5;
          border:1px solid var(--line);min-width:60px}
.card .ex .c{font-family:var(--cjk);font-size:28px;line-height:1.15}
.card .ex .hv{font-size:.7rem;color:var(--muted)}
.card .ex .m{font-size:.78rem}
.card .hint{color:var(--muted);font-size:1.1rem}
</style>
</head>
<body>
<main>
  <h1>Nhóm 8 — Bộ thủ thực phẩm</h1>
  <p>Chạm vào một món</p>

  <section class="stage">
    <svg id="fig" viewBox="0 0 500 400" role="img" aria-label="Bàn bếp với cơm và gạo">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4e6d0"/>
          <stop offset="100%" stop-color="#dcc8a8"/>
        </linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c89a68"/>
          <stop offset="100%" stop-color="#8a5a30"/>
        </linearGradient>
        <radialGradient id="bowlG" cx="40%" cy="35%" r="75%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#d8dce0"/>
        </radialGradient>
        <radialGradient id="riceG" cx="40%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e8e0c8"/>
        </radialGradient>
        <linearGradient id="sackG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8d0a0"/>
          <stop offset="100%" stop-color="#a88050"/>
        </linearGradient>
        <radialGradient id="spot" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fff"/>
          <stop offset="100%" stop-color="#f8ecd8"/>
        </radialGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>

      <!-- tường bếp -->
      <rect width="500" height="400" fill="url(#wall)"/>

      <!-- gạch ốp tường (tile) -->
      <g opacity="0.35" stroke="#b09880" stroke-width="0.8" fill="none">
        <line x1="0" y1="60" x2="500" y2="60"/>
        <line x1="0" y1="110" x2="500" y2="110"/>
        <line x1="0" y1="160" x2="500" y2="160"/>
        <line x1="60" y1="10" x2="60" y2="160"/>
        <line x1="130" y1="10" x2="130" y2="160"/>
        <line x1="200" y1="10" x2="200" y2="160"/>
        <line x1="270" y1="10" x2="270" y2="160"/>
        <line x1="340" y1="10" x2="340" y2="160"/>
        <line x1="410" y1="10" x2="410" y2="160"/>
      </g>

      <!-- cửa sổ nhỏ phía trên -->
      <rect x="200" y="30" width="100" height="80" fill="#a8d4e8" stroke="#8a6030" stroke-width="3"/>
      <line x1="250" y1="30" x2="250" y2="110" stroke="#8a6030" stroke-width="2"/>
      <line x1="200" y1="70" x2="300" y2="70" stroke="#8a6030" stroke-width="2"/>
      <ellipse cx="235" cy="50" rx="18" ry="5" fill="#fff" opacity="0.7"/>

      <!-- bàn gỗ -->
      <rect x="0" y="260" width="500" height="140" fill="url(#wood)"/>
      <line x1="0" y1="270" x2="500" y2="270" stroke="#5a3a18" stroke-width="2" opacity="0.5"/>
      <!-- vân gỗ -->
      <path d="M 0 320 Q 100 318 200 322 Q 350 318 500 322"
            stroke="#6a4a20" stroke-width="1" fill="none" opacity="0.35"/>
      <path d="M 0 365 Q 120 362 240 366 Q 380 362 500 366"
            stroke="#6a4a20" stroke-width="1" fill="none" opacity="0.35"/>

      <!-- ===== BÁT CƠM (食) — trái ===== -->
      <g id="food">
        <!-- đế -->
        <ellipse cx="155" cy="278" rx="52" ry="7" fill="#3a1a0a" opacity="0.25"/>

        <!-- khói bốc lên (3 làn) -->
        <g stroke="#c8c8c8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65">
          <path d="M 130 220 Q 124 205 130 190 Q 136 178 132 162"/>
          <path d="M 155 215 Q 148 198 155 180 Q 162 165 158 148"/>
          <path d="M 180 220 Q 174 205 180 190 Q 186 178 182 162"/>
        </g>

        <!-- thân bát -->
        <ellipse cx="155" cy="272" rx="48" ry="8" fill="#a8a098"/>
        <path d="M 107 260 Q 107 285 122 292 Q 140 297 155 297 Q 170 297 188 292 Q 203 285 203 260 Z"
              fill="url(#bowlG)" stroke="#a8a098" stroke-width="1.5"/>
        <ellipse cx="155" cy="260" rx="48" ry="9" fill="#f8f8f8" stroke="#a8a098" stroke-width="1.5"/>

        <!-- cơm (núi cơm) -->
        <path d="M 118 258 Q 120 235 138 228 Q 155 222 172 228 Q 190 235 192 258 Z"
              fill="url(#riceG)" stroke="#c8bca0" stroke-width="1"/>
        <!-- các hạt cơm -->
        <ellipse cx="135" cy="250" rx="2.5" ry="1.5" fill="#fff" transform="rotate(-20 135 250)"/>
        <ellipse cx="145" cy="246" rx="2.5" ry="1.5" fill="#fff" transform="rotate(15 145 246)"/>
        <ellipse cx="158" cy="244" rx="2.5" ry="1.5" fill="#fff" transform="rotate(-10 158 244)"/>
        <ellipse cx="170" cy="248" rx="2.5" ry="1.5" fill="#fff" transform="rotate(20 170 248)"/>
        <ellipse cx="150" cy="252" rx="2.5" ry="1.5" fill="#fff" transform="rotate(-15 150 252)"/>
        <ellipse cx="165" cy="254" rx="2.5" ry="1.5" fill="#fff" transform="rotate(10 165 254)"/>

        <!-- viền trang trí bát -->
        <ellipse cx="155" cy="270" rx="48" ry="6" fill="none" stroke="#c83030" stroke-width="1.5" opacity="0.7"/>

        <!-- đôi đũa -->
        <line x1="200" y1="232" x2="280" y2="215" stroke="#c89a60" stroke-width="3" stroke-linecap="round"/>
        <line x1="200" y1="238" x2="282" y2="222" stroke="#c89a60" stroke-width="3" stroke-linecap="round"/>
        <line x1="198" y1="230" x2="202" y2="230" stroke="#3a2a10" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="198" y1="240" x2="202" y2="240" stroke="#3a2a10" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- ===== BAO GẠO (米) — phải ===== -->
      <g id="rice">
        <!-- đế -->
        <ellipse cx="365" cy="278" rx="58" ry="7" fill="#3a1a0a" opacity="0.25"/>

        <!-- bao gạo -->
        <path d="M 310 270 Q 308 220 320 195 Q 335 178 365 176 Q 395 178 410 195 Q 422 220 420 270 Z"
              fill="url(#sackG)" stroke="#8a6030" stroke-width="1.5"/>
        <!-- miệng bao cuộn -->
        <ellipse cx="365" cy="176" rx="46" ry="10" fill="#c8a878" stroke="#8a6030" stroke-width="1.2"/>
        <ellipse cx="365" cy="176" rx="32" ry="6" fill="#a88050"/>
        <!-- buộc dây -->
        <path d="M 330 185 Q 340 190 350 186 Q 360 182 370 186 Q 380 190 390 186 Q 400 182 402 188"
              stroke="#8a4020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- chữ Phúc đỏ -->
        <rect x="345" y="220" width="40" height="40" fill="#c83030" rx="3"/>
        <text x="365" y="248" font-family="serif" font-size="26" fill="#fff"
              text-anchor="middle" font-weight="bold">米</text>

        <!-- gạo tràn ra trên bàn (một đống nhỏ) -->
        <ellipse cx="300" cy="278" rx="26" ry="5" fill="#a88050"/>
        <ellipse cx="300" cy="272" rx="22" ry="6" fill="url(#riceG)"/>
        <!-- các hạt gạo rơi vãi -->
        <ellipse cx="285" cy="284" rx="2.5" ry="1.2" fill="#fff" stroke="#c8bca0" stroke-width="0.4" transform="rotate(-20 285 284)"/>
        <ellipse cx="296" cy="288" rx="2.5" ry="1.2" fill="#fff" stroke="#c8bca0" stroke-width="0.4" transform="rotate(15 296 288)"/>
        <ellipse cx="308" cy="286" rx="2.5" ry="1.2" fill="#fff" stroke="#c8bca0" stroke-width="0.4" transform="rotate(-10 308 286)"/>
        <ellipse cx="276" cy="290" rx="2.5" ry="1.2" fill="#fff" stroke="#c8bca0" stroke-width="0.4" transform="rotate(25 276 290)"/>
        <ellipse cx="318" cy="292" rx="2.5" ry="1.2" fill="#fff" stroke="#c8bca0" stroke-width="0.4" transform="rotate(-15 318 292)"/>
        <ellipse cx="292" cy="280" rx="2.5" ry="1.2" fill="#fff" stroke="#c8bca0" stroke-width="0.4" transform="rotate(5 292 280)"/>
        <ellipse cx="305" cy="278" rx="2.5" ry="1.2" fill="#fff" stroke="#c8bca0" stroke-width="0.4" transform="rotate(-20 305 278)"/>
      </g>

      <g id="hotspots"></g>
    </svg>
  </section>

  <section class="card" id="card"></section>
</main>

<script>
const NS = "http://www.w3.org/2000/svg";

const RADICALS = {
  shi: {glyph:"食", variant:"饣", pinyin:"shí", hv:"thực", meaning:"ăn uống", icon:"🍚",
        ex:[{c:"饭",hv:"phạn",m:"cơm"},{c:"饮",hv:"ẩm",m:"uống"},{c:"饱",hv:"bão",m:"no"}]},
  mi:  {glyph:"米", variant:"", pinyin:"mǐ",  hv:"mễ",   meaning:"gạo",     icon:"🌾",
        ex:[{c:"粉",hv:"phấn",m:"bột"},{c:"糖",hv:"đường",m:"đường"},{c:"粥",hv:"chúc",m:"cháo"}]}
};

const SPOTS = [
  {id:"shi", x:155, y:250, r:18},   /* bát cơm */
  {id:"mi",  x:365, y:220, r:18}    /* bao gạo */
];

const panel    = document.getElementById("card");
const svgSpots = document.getElementById("hotspots");

SPOTS.forEach(s => {
  const r = RADICALS[s.id];
  const g = document.createElementNS(NS,"g");
  g.setAttribute("class","hotspot");
  g.setAttribute("tabindex","0");
  g.setAttribute("role","button");
  g.setAttribute("aria-label", r.pinyin + " " + r.hv);
  g.dataset.id = s.id;

  const c = document.createElementNS(NS,"circle");
  c.setAttribute("cx",s.x); c.setAttribute("cy",s.y); c.setAttribute("r",s.r);

  const t = document.createElementNS(NS,"text");
  t.setAttribute("class","glyph");
  t.setAttribute("x",s.x); t.setAttribute("y",s.y);
  t.textContent = r.glyph;

  g.append(c,t);
  g.addEventListener("click", () => select(s.id));
  g.addEventListener("keydown", e => {
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(s.id); }
  });
  svgSpots.appendChild(g);
});

function select(id){
  document.querySelectorAll(".hotspot").forEach(el =>
    el.classList.toggle("sel", el.dataset.id === id));
  renderCard(id);
}

function renderCard(id){
  const r = RADICALS[id];
  panel.innerHTML = `
    <div class="icon">${r.icon}</div>
    <div class="glyph">${r.glyph}</div>
    ${r.variant ? `<div class="variant">biến thể: ${r.variant}</div>` : ""}
    <p class="pron">${r.pinyin}<span class="hv">· ${r.hv}</span></p>
    <p class="meaning">${r.meaning}</p>
    <div class="examples">
      ${r.ex.map(x => `
        <div class="ex">
          <span class="c">${x.c}</span>
          <span class="hv">${x.hv}</span>
          <span class="m">${x.m}</span>
        </div>`).join("")}
    </div>`;
}

panel.innerHTML = `<p class="hint">👆 Chạm vào một món</p>`;
</script>
</body>
</html>
